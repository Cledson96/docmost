services:
  docmost:
    image: ${WEB_IMAGE:?defina WEB_IMAGE}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      # Not a hard dependency: only PDF export needs it, and the app must still
      # come up if the renderer is unhealthy.
      gotenberg:
        condition: service_started
    environment:
      APP_URL: ${APP_URL:?defina APP_URL}
      APP_SECRET: ${APP_SECRET:?defina APP_SECRET}
      DATABASE_URL: postgresql://docmost:${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD}@db:5432/docmost
      REDIS_URL: redis://redis:6379
      PORT: 3000
      HOST: 0.0.0.0
      AI_DRIVER: ${AI_DRIVER:-openai}
      AI_COMPLETION_MODEL: ${AI_COMPLETION_MODEL:-gpt-4o-mini}
      AI_CHAT_MODEL: ${AI_CHAT_MODEL:-gpt-4o-mini}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OLLAMA_API_URL: ${OLLAMA_API_URL:-}
      GOTENBERG_URL: http://gotenberg:3000
      PDF_RENDER_BASE_URL: http://docmost:3000
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:3000"
    restart: unless-stopped
    volumes:
      - docmost:/app/data/storage
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "--fail",
          "--silent",
          "http://127.0.0.1:3000/api/health/live",
        ]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 30s

  db:
    image: pgvector/pgvector:pg18
    environment:
      POSTGRES_DB: docmost
      POSTGRES_USER: docmost
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD}
    restart: unless-stopped
    volumes:
      - db_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docmost -d docmost"]
      interval: 10s
      timeout: 5s
      retries: 10

  db-backup:
    # Same image as db so pg_dump matches the server version exactly.
    image: pgvector/pgvector:pg18
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
    # Bypass the postgres entrypoint; this container only runs the dump loop.
    entrypoint: ["/bin/bash", "/usr/local/bin/backup-db.sh"]
    restart: unless-stopped
    volumes:
      - ./backup-db.sh:/usr/local/bin/backup-db.sh:ro
      # Host path, not a named volume: dumps must survive `docker volume rm`
      # and be trivially copied off the box.
      - ../backups:/backups

  # Headless Chromium, used only to render page exports to PDF. Kept out of the
  # app image so the image stays small on every deploy, and so a heavy render
  # cannot starve the app of memory.
  gotenberg:
    image: gotenberg/gotenberg:8
    command:
      - "gotenberg"
      # It should only ever fetch this app's own render route.
      - "--chromium-allow-list=^http://docmost:3000/.*"
    restart: unless-stopped
    # A render is short-lived; this keeps a runaway one from taking the box down.
    mem_limit: 1g

  redis:
    image: redis:8
    command:
      [
        "redis-server",
        "--appendonly",
        "yes",
        "--maxmemory-policy",
        "noeviction",
      ]
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  docmost:
  db_data:
  redis_data:
