name: Deploy production

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: docmost-production-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/cledson96/docmost

jobs:
  ci:
    name: Validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.18.3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Build first: @docmost/editor-ext resolves to its dist/, so any spec
      # that transitively imports it fails with TS2307 on a clean runner.
      - name: Build workspace
        run: pnpm build

      - name: Server unit tests
        run: pnpm --filter server test

      - name: Client unit tests
        run: pnpm --filter client test

  build-push:
    name: Build and push image
    if: github.event_name != 'pull_request'
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to VPS
    if: github.event_name != 'pull_request'
    needs: build-push
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: read
    env:
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/opt/docmost' }}
      APP_DOMAIN: ${{ vars.APP_DOMAIN || 'wiki.cledson.com.br' }}
      APP_PORT: ${{ vars.APP_PORT || '3000' }}
      APP_URL: ${{ vars.APP_URL || 'https://wiki.cledson.com.br' }}
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
      CERTBOT_EMAIL: ${{ vars.CERTBOT_EMAIL || secrets.CERTBOT_EMAIL || '' }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      AI_DRIVER: ${{ vars.AI_DRIVER || 'openai' }}
      AI_COMPLETION_MODEL: ${{ vars.AI_COMPLETION_MODEL || 'gpt-4o-mini' }}
      AI_CHAT_MODEL: ${{ vars.AI_CHAT_MODEL || 'gpt-4o-mini' }}
      # Without these the server falls back to the log driver, which in
      # production returns without sending and without logging — mail silently
      # disappears. Defaults to Gmail; override the host/port vars for a
      # different provider.
      MAIL_DRIVER: ${{ vars.MAIL_DRIVER || 'smtp' }}
      MAIL_FROM_ADDRESS: ${{ vars.MAIL_FROM_ADDRESS }}
      MAIL_FROM_NAME: ${{ vars.MAIL_FROM_NAME || 'Gobrax Wiki' }}
      SMTP_HOST: ${{ vars.SMTP_HOST || 'smtp.gmail.com' }}
      SMTP_PORT: ${{ vars.SMTP_PORT || '587' }}
      SMTP_SECURE: ${{ vars.SMTP_SECURE || 'false' }}
      SMTP_USERNAME: ${{ vars.SMTP_USERNAME }}
    steps:
      - name: Checkout infrastructure
        uses: actions/checkout@v4

      - name: Prepare SSH
        shell: bash
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "${VPS_PORT}" -H "${VPS_HOST}" >> ~/.ssh/known_hosts

      - name: Generate production environment
        shell: bash
        env:
          APP_SECRET: ${{ secrets.APP_SECRET }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || '' }}
          OLLAMA_API_URL: ${{ vars.OLLAMA_API_URL || '' }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD || '' }}
        run: |
          umask 077
          # printf, not a heredoc: the previous unquoted <<EOF let the shell
          # expand any $ or `...` inside a secret, so a password containing one
          # reached the container mangled. Values arrive as env vars and are
          # written verbatim.
          {
            printf 'WEB_IMAGE=%s\n' "${IMAGE}:${GITHUB_SHA}"
            printf 'APP_PORT=%s\n' "$APP_PORT"
            printf 'APP_URL=%s\n' "$APP_URL"
            printf 'APP_SECRET=%s\n' "$APP_SECRET"
            printf 'POSTGRES_PASSWORD=%s\n' "$POSTGRES_PASSWORD"
            printf 'AI_DRIVER=%s\n' "$AI_DRIVER"
            printf 'AI_COMPLETION_MODEL=%s\n' "$AI_COMPLETION_MODEL"
            printf 'AI_CHAT_MODEL=%s\n' "$AI_CHAT_MODEL"
            printf 'OPENAI_API_KEY=%s\n' "$OPENAI_API_KEY"
            printf 'GEMINI_API_KEY=%s\n' "$GEMINI_API_KEY"
            printf 'OLLAMA_API_URL=%s\n' "$OLLAMA_API_URL"
            printf 'MAIL_DRIVER=%s\n' "$MAIL_DRIVER"
            printf 'MAIL_FROM_ADDRESS=%s\n' "$MAIL_FROM_ADDRESS"
            printf 'MAIL_FROM_NAME=%s\n' "$MAIL_FROM_NAME"
            printf 'SMTP_HOST=%s\n' "$SMTP_HOST"
            printf 'SMTP_PORT=%s\n' "$SMTP_PORT"
            printf 'SMTP_SECURE=%s\n' "$SMTP_SECURE"
            printf 'SMTP_USERNAME=%s\n' "$SMTP_USERNAME"
            printf 'SMTP_PASSWORD=%s\n' "$SMTP_PASSWORD"
          } > /tmp/docmost.env

      - name: Upload release infrastructure
        shell: bash
        run: |
          tar -czf /tmp/docmost-infra.tgz deploy scripts
          scp -i ~/.ssh/id_ed25519 -P "${VPS_PORT}" /tmp/docmost-infra.tgz "${VPS_USER}@${VPS_HOST}:/tmp/docmost-infra.tgz"
          scp -i ~/.ssh/id_ed25519 -P "${VPS_PORT}" /tmp/docmost.env "${VPS_USER}@${VPS_HOST}:/tmp/docmost.env"

      - name: Execute deployment
        shell: bash
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
        run: |
          ssh -i ~/.ssh/id_ed25519 -p "${VPS_PORT}" "${VPS_USER}@${VPS_HOST}" \
            "DEPLOY_PATH='${DEPLOY_PATH}' APP_DOMAIN='${APP_DOMAIN}' APP_PORT='${APP_PORT}' CERTBOT_EMAIL='${CERTBOT_EMAIL}' GHCR_USER='${GHCR_USER}' GHCR_TOKEN='${GHCR_TOKEN}' bash -s" <<'REMOTE'
          set -euo pipefail
          if [ "$(id -u)" -eq 0 ]; then run_root() { "$@"; }; else run_root() { sudo -n "$@"; }; fi
          run_root mkdir -p "$DEPLOY_PATH"
          run_root tar -xzf /tmp/docmost-infra.tgz -C "$DEPLOY_PATH"
          run_root cp /tmp/docmost.env "$DEPLOY_PATH/.env"
          run_root env DEPLOY_PATH="$DEPLOY_PATH" APP_DOMAIN="$APP_DOMAIN" APP_PORT="$APP_PORT" CERTBOT_EMAIL="$CERTBOT_EMAIL" WEB_IMAGE="$(grep '^WEB_IMAGE=' "$DEPLOY_PATH/.env" | cut -d= -f2-)" GHCR_USER="$GHCR_USER" GHCR_TOKEN="$GHCR_TOKEN" bash "$DEPLOY_PATH/scripts/deploy-docker.sh"
          rm -f /tmp/docmost-infra.tgz /tmp/docmost.env
          REMOTE
