services:
  docmost:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      - db
      - redis
    environment:
      APP_URL: ${APP_URL:-http://localhost:3000}
      APP_SECRET: ${APP_SECRET}
      DATABASE_URL: postgresql://docmost:${POSTGRES_PASSWORD}@db:5432/docmost
      REDIS_URL: redis://redis:6379
      GOTENBERG_URL: http://gotenberg:3000
      PDF_RENDER_BASE_URL: http://docmost:3000
    ports:
      - "3000:3000"
    restart: unless-stopped
    volumes:
      - docmost:/app/data/storage

  db:
    image: pgvector/pgvector:pg18
    environment:
      POSTGRES_DB: docmost
      POSTGRES_USER: docmost
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    restart: unless-stopped
    volumes:
      - db_data:/var/lib/postgresql

  redis:
    image: redis:8
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    restart: unless-stopped
    volumes:
      - redis_data:/data

  # Headless Chromium used only to render page exports to PDF.
  gotenberg:
    image: gotenberg/gotenberg:8
    command:
      - "gotenberg"
      # Only ever asked to fetch this app's own render route.
      - "--chromium-allow-list=^http://docmost:3000/.*"
      - "--chromium-disable-javascript=false"
    restart: unless-stopped

volumes:
  docmost:
  db_data:
  redis_data:
